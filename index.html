<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Health IQ">
<title>Health IQ - Shane Harmon</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;background:#080b12;color:#e2e8f0;min-height:100vh;max-width:430px;margin:0 auto;padding-bottom:20px;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;-webkit-appearance:none}
a{text-decoration:none}
.hidden{display:none!important}

/* HEADER */
#header{padding:52px 20px 16px;background:linear-gradient(180deg,#0d1421 0%,#080b12 100%)}
.header-row{display:flex;justify-content:space-between;align-items:flex-start}
.header-label{font-size:10px;letter-spacing:3px;color:#7dd3fc;text-transform:uppercase;margin-bottom:6px;text-shadow:0 0 12px #38bdf880}
.header-name{font-size:24px;font-weight:800;letter-spacing:-0.5px;color:#f1f5f9}
.header-sub{font-size:12px;color:#94a3b8;margin-top:4px}
.stat-row{display:flex;gap:8px;margin-top:14px}
.stat-pill{flex:1;border-radius:10px;padding:8px 4px;text-align:center;border-width:2px;border-style:solid;cursor:pointer;transition:all 0.2s}
.stat-pill:active{transform:scale(0.96)}
.stat-num{font-size:20px;font-weight:800}
.stat-lbl{font-size:10px;color:#94a3b8;letter-spacing:1px;margin-top:2px}

/* TABS */
#tabnav{display:flex;border-bottom:1px solid #1e293b;position:sticky;top:0;background:#080b12;z-index:50;padding-top:4px}
.tabn{flex:1;background:none;border:none;color:#64748b;font-size:11px;font-weight:500;padding:10px 4px 9px;border-bottom:2px solid transparent;transition:all .2s}
.tabn.active{color:#60a5fa;font-weight:700;border-bottom-color:#60a5fa}
.badge{display:inline-block;background:#ef4444;color:#fff;border-radius:99px;font-size:7px;padding:1px 4px;margin-left:3px;font-weight:800;vertical-align:middle}

/* PAGES */
.page{padding:14px 20px 0;display:none}
.page.active{display:block}
.sec-label{font-size:10px;letter-spacing:2px;color:#7dd3fc;text-transform:uppercase;margin-bottom:12px;margin-top:2px;text-shadow:0 0 10px #38bdf850}

/* PILL BANNERS */
.pill-row{display:flex;gap:6px;margin-bottom:0}
.pill-btn{flex:1;border-radius:12px;padding:9px 8px;cursor:pointer;display:flex;align-items:center;gap:7px;border-width:1px;border-style:solid;transition:all 0.2s;-webkit-appearance:none;background:none;text-align:left;min-width:0;font-family:inherit}
.pill-btn:active{opacity:0.85}
.pill-emoji{font-size:15px;flex-shrink:0}
.pill-title{font-size:10px;font-weight:700;white-space:nowrap}
.pill-sub{font-size:9px;color:#94a3b8;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* PILL DRAWERS */
.pill-col{flex:1;display:flex;flex-direction:column;min-width:0}
.pill-drawer{overflow:hidden;max-height:0;opacity:0;transition:max-height 0.5s cubic-bezier(0.4,0,0.2,1),opacity 0.35s ease}
.pill-drawer.open{max-height:2000px;opacity:1}
.drawer-body{border-width:0 1px 1px 1px;border-style:solid;border-radius:0 0 14px 14px;background:#0a1421;padding:14px 14px 16px}

/* DRAWER CONTACT STYLES */
.dr-contact{padding:12px 0;border-bottom:1px solid #1e293b}
.dr-contact:last-child{border-bottom:none;padding-bottom:0}
.dr-contact-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dr-avatar{width:38px;height:38px;border-radius:10px;background:#1e293b;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.dr-name{font-size:13px;font-weight:700;color:#e2e8f0}
.dr-role{font-size:11px;color:#7dd3fc;margin-top:1px}
.dr-practice{font-size:10px;color:#94a3b8;margin-top:1px}
.dr-link{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.dr-link-icon{width:30px;height:30px;border-radius:8px;background:#0d1e35;border:1px solid #1e3a5f;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.dr-link-label{font-size:9px;color:#64748b}
.dr-link-val{font-size:12px;color:#60a5fa;font-weight:600;line-height:1.4}
.dr-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.dr-tag{background:#1e293b;color:#7dd3fc;font-size:10px;padding:3px 8px;border-radius:99px}

/* DRAWER MED STYLES */
.dr-med-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dr-med-name{font-size:15px;font-weight:800;color:#e2e8f0}
.dr-med-dose{font-size:12px;margin-top:2px}
.dr-med-rx{font-size:10px;color:#64748b;margin-top:1px}
.dr-section{background:#080b12;border-radius:8px;padding:9px 11px;margin-bottom:7px}
.dr-sec-lbl{font-size:9px;color:#7dd3fc;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.dr-sec-txt{font-size:12px;color:#cbd5e1;line-height:1.6}
.dr-impact{font-size:12px;color:#4ade80;margin-top:3px}
.dr-note{background:#0a1e35;border-radius:8px;padding:9px 11px;border-width:1px;border-style:solid}
.dr-note-lbl{font-size:9px;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.dr-note-txt{font-size:12px;color:#cbd5e1;line-height:1.6}

/* DRAWER SUPP STYLES */
.dr-supp-header{background:#0a1e35;border:1px solid #1e3a5f;border-radius:10px;padding:10px 12px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.dr-supp-score{font-size:11px;font-weight:600;color:#7dd3fc}
.dr-supp-sub{font-size:10px;color:#94a3b8;margin-top:1px}
.dr-supp-item{border-radius:12px;margin-bottom:8px;overflow:hidden;border-width:1px;border-style:solid;background:#0d1421}
.dr-supp-row{padding:11px 12px;display:flex;gap:9px;align-items:center;cursor:pointer}
.dr-supp-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dr-supp-name{font-size:12px;font-weight:700;color:#e2e8f0}
.dr-supp-brand{font-size:10px;color:#94a3b8;margin-top:1px}
.dr-supp-goal{font-size:10px;padding:2px 7px;border-radius:99px;font-weight:600;flex-shrink:0}
.dr-supp-chev{color:#64748b;font-size:13px;flex-shrink:0}
.dr-supp-detail{max-height:0;overflow:hidden;transition:max-height 0.35s ease,opacity 0.25s;opacity:0;padding:0 12px}
.dr-supp-detail.open{max-height:400px;opacity:1;padding:0 12px 10px}
.dr-supp-effect{font-size:11px;color:#cbd5e1;line-height:1.55;margin-bottom:6px;padding-top:8px;border-top:1px solid #1e293b}
.dr-supp-impact{font-size:10px;color:#4ade80;margin-bottom:2px}
.dr-supp-note{font-size:10px;color:#94a3b8;margin-top:6px;line-height:1.5;padding-top:6px;border-top:1px solid #1e293b}

/* BM CARDS */
.bm-card{background:#0d1421;border-radius:14px;padding:13px 15px;margin-bottom:9px;cursor:pointer;border-width:1px;border-style:solid;transition:border-color 0.2s}
.bm-inner{display:flex;align-items:center;gap:12px;width:100%}
.bm-label-row{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.bm-name{font-size:13px;font-weight:600;color:#e2e8f0}
.bm-note{font-size:11px;color:#94a3b8}
.bm-val{font-size:18px;font-weight:800;text-align:right}
.bm-unit{font-size:10px;color:#94a3b8;text-align:right;margin-top:1px}
.bm-prev{font-size:10px;color:#94a3b8;margin-top:2px}
.ibtn{background:none;border:1px solid #334155;color:#7dd3fc;border-radius:50%;width:19px;height:19px;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;line-height:1}
.dot{display:inline-block;border-radius:50%;flex-shrink:0}

/* INLINE CHART */
.inline-chart{max-height:0;overflow:hidden;transition:max-height 0.45s cubic-bezier(0.4,0,0.2,1),opacity 0.3s ease;opacity:0}
.inline-chart.open{max-height:420px;opacity:1}
.inline-chart-inner{padding-top:14px;border-top:1px solid #1e3a5f;margin-top:14px}
.chart-optimal{font-size:10px;color:#4ade80;margin-top:8px}
.chart-points{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.chart-pt{flex:1;min-width:55px;background:#080b12;border-radius:8px;padding:7px 5px;text-align:center;border-width:1px;border-style:solid}
.chart-pt-date{font-size:9px;color:#94a3b8;margin-bottom:3px}
.chart-pt-val{font-size:13px;font-weight:700}
.chart-close-row{display:flex;justify-content:flex-end;margin-top:10px}
.chart-close-btn{background:#1e293b;border:none;color:#94a3b8;border-radius:99px;padding:5px 14px;font-size:11px;font-family:inherit}

/* CAT GRID */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.cat-card{background:#0d1421;border-radius:12px;padding:12px 14px;cursor:pointer;border-width:1px;border-style:solid;transition:transform 0.15s}
.cat-card:active{transform:scale(0.97)}
.cat-top{display:flex;justify-content:space-between;align-items:center}
.cat-name{font-size:12px;font-weight:600;margin-top:8px;color:#e2e8f0}
.cat-sub{font-size:10px;color:#94a3b8;margin-top:2px}
.cat-bar-bg{margin-top:8px;height:3px;border-radius:99px;background:#1e293b;overflow:hidden}
.cat-bar{height:100%;border-radius:99px}
.cat-scroll{overflow-x:auto;padding-bottom:12px;margin-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-scroll-inner{display:flex;gap:6px;width:max-content}
.cat-btn{border-radius:99px;font-size:11px;padding:6px 12px;border-width:1px;border-style:solid;white-space:nowrap;background:#0d1421;border-color:#1e293b;color:#94a3b8;transition:all 0.2s}
.cat-btn.active{background:#1e3a5f;border-color:#60a5fa;color:#60a5fa;font-weight:700}
#status-filter-banner{display:none;background:#1e293b;border-radius:10px;padding:8px 12px;margin-bottom:12px;flex-direction:row;align-items:center;justify-content:space-between}
#status-filter-banner.visible{display:flex}
.sfb-label{font-size:11px;font-weight:600}
.sfb-clear{background:none;border:none;font-size:11px;color:#60a5fa;font-family:inherit}

/* INSIGHTS */
.ins-card{border-radius:14px;padding:14px 16px;margin-bottom:10px;border-width:1px;border-style:solid}
.ins-row{display:flex;gap:10px;align-items:flex-start}
.ins-icon{font-size:15px;flex-shrink:0;min-width:20px;text-align:center}
.ins-title{font-size:13px;font-weight:700;margin-bottom:5px}
.ins-body{font-size:12px;color:#cbd5e1;line-height:1.65}
.ins-filter{overflow-x:auto;padding-bottom:10px;margin-bottom:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ins-filter::-webkit-scrollbar{display:none}
.ins-filter-inner{display:flex;gap:6px;width:max-content}
.ins-btn{border-radius:99px;font-size:10px;padding:5px 11px;border-width:1px;border-style:solid;white-space:nowrap;background:#0d1421;border-color:#1e293b;color:#94a3b8}
.ins-btn.active{background:#1e3a5f;border-color:#60a5fa;color:#60a5fa;font-weight:700}

/* ACTIONS */
.action-card{background:#0d1421;border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;border-width:1px;border-style:solid}
.action-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;border-width:1px;border-style:solid}
.action-badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.urgency-badge{font-size:8px;font-weight:800;letter-spacing:1px;padding:2px 6px;border-radius:99px}
.doctor-badge{font-size:9px;color:#94a3b8;background:#1e293b;padding:2px 7px;border-radius:99px}
.action-title{font-size:13px;font-weight:600;margin-bottom:5px;line-height:1.4;color:#e2e8f0}
.action-why{font-size:11px;color:#94a3b8;line-height:1.5}
.next-panel{background:#0d1421;border:1px solid #1e293b;border-radius:14px;padding:14px 16px;margin-top:8px}
.panel-item{display:flex;align-items:center;gap:8px;padding:7px 0}
.panel-dot{width:5px;height:5px;border-radius:50%;background:#7dd3fc;flex-shrink:0}
.panel-text{font-size:12px;color:#cbd5e1}

/* INFO MODAL */
#info-modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.85);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
#info-modal.open{display:flex}
.info-sheet{background:#0d1421;border-radius:20px 20px 0 0;border:1px solid #1e3a5f;border-bottom:none;padding:20px 20px 44px;width:100%;max-width:430px;max-height:80vh;overflow-y:auto}
.info-handle{width:36px;height:4px;background:#1e3a5f;border-radius:99px;margin:0 auto 18px}
.info-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.info-bm-label{font-size:9px;letter-spacing:2px;color:#7dd3fc;text-transform:uppercase;margin-bottom:4px}
.info-bm-name{font-size:20px;font-weight:800;color:#f1f5f9}
.info-bm-cat{font-size:11px;color:#94a3b8;margin-top:2px}
.info-close{background:#1e293b;border:none;color:#94a3b8;border-radius:99px;width:30px;height:30px;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.info-sec{background:#080b12;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.info-sec-label{font-size:9px;color:#7dd3fc;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
.info-sec-text{font-size:13px;color:#e2e8f0;line-height:1.7}
.info-range{background:#0a1e35;border-radius:12px;padding:10px 14px;border:1px solid #22c55e30}
.info-range-label{font-size:9px;color:#4ade80;letter-spacing:1px;margin-bottom:3px}
.info-range-val{font-size:13px;color:#cbd5e1}

/* CONTACTS PAGE (Care) */
.care-page-contact{background:#0d1421;border:1px solid #1e3a5f;border-radius:14px;margin-bottom:12px;overflow:hidden}
.care-contact-header{padding:14px 16px;cursor:pointer;display:flex;gap:12px;align-items:center}
.care-avatar{width:40px;height:40px;border-radius:12px;background:#1e293b;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.care-name{font-size:13px;font-weight:700;color:#e2e8f0}
.care-role{font-size:11px;color:#7dd3fc;margin-top:2px}
.care-practice{font-size:10px;color:#94a3b8;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.care-chev{color:#64748b;font-size:16px;flex-shrink:0;margin-left:auto}
.care-contact-body{border-top:1px solid #1e293b;padding:14px 16px;display:none;flex-direction:column;gap:10px}
.care-contact-body.open{display:flex}
.care-link{display:flex;align-items:center;gap:10px}
.care-link-icon{width:36px;height:36px;border-radius:10px;background:#0a1e35;border:1px solid #1e3a5f;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.care-link-label{font-size:10px;color:#94a3b8}
.care-link-val{font-size:13px;color:#60a5fa;font-weight:600;line-height:1.4}
.care-bm-box{background:#080b12;border-radius:10px;padding:10px 12px}
.care-bm-label{font-size:9px;color:#7dd3fc;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.care-bm-tags{display:flex;flex-wrap:wrap;gap:5px}
.care-bm-tag{background:#1e293b;color:#7dd3fc;font-size:10px;padding:3px 8px;border-radius:99px}
</style>
</head>
<body>

<div id="header">
  <div class="header-row">
    <div>
      <div class="header-label">Health Intelligence</div>
      <div class="header-name">Shane Harmon</div>
      <div class="header-sub">Last updated: Jun 2026 &middot; Age 46</div>
    </div>
    <svg width="70" height="70" viewBox="0 0 70 70">
      <circle cx="35" cy="35" r="30" fill="none" stroke="#1e293b" stroke-width="5"/>
      <circle id="score-ring" cx="35" cy="35" r="30" fill="none" stroke="#22c55e" stroke-width="5" stroke-dasharray="0 188.5" stroke-linecap="round" transform="rotate(-90 35 35)"/>
      <text id="score-text" x="35" y="33" text-anchor="middle" fill="#f1f5f9" font-size="18" font-weight="800">--</text>
      <text x="35" y="46" text-anchor="middle" fill="#64748b" font-size="8">SCORE</text>
    </svg>
  </div>
  <div class="stat-row">
    <div class="stat-pill" id="pill-optimal" style="background:#0f2818;border-color:#22c55e25" onclick="filterByStatus('optimal')">
      <div class="stat-num" style="color:#4ade80" id="cnt-optimal">--</div><div class="stat-lbl">OPTIMAL</div>
    </div>
    <div class="stat-pill" id="pill-concern" style="background:#1c1505;border-color:#f59e0b25" onclick="filterByStatus('concern')">
      <div class="stat-num" style="color:#fbbf24" id="cnt-concern">--</div><div class="stat-lbl">MONITOR</div>
    </div>
    <div class="stat-pill" id="pill-high" style="background:#1a0808;border-color:#ef444425" onclick="filterByStatus('high')">
      <div class="stat-num" style="color:#f87171" id="cnt-high">--</div><div class="stat-lbl">ACTION</div>
    </div>
  </div>
</div>

<div id="tabnav">
  <button class="tabn active" onclick="showTab('overview')">Overview</button>
  <button class="tabn" onclick="showTab('labs')">Labs</button>
  <button class="tabn" onclick="showTab('insights')">Insights</button>
  <button class="tabn" onclick="showTab('actions')">Actions<span class="badge">5</span></button>
</div>

<!-- OVERVIEW -->
<div id="page-overview" class="page active">

  <!-- M/S/C PILLS + DRAWERS -->
  <div style="margin-bottom:14px" id="pill-area">
    <!-- Collapsed: all 3 pills visible -->
    <div class="pill-row" id="pills-collapsed">
      <button class="pill-btn" data-drawer="rx" style="background:#0a1628;border-color:#3b82f640">
        <span class="pill-emoji">&#128138;</span>
        <div style="min-width:0"><div class="pill-title" style="color:#60a5fa">Medications</div><div class="pill-sub">Levothyroxine 50mcg</div></div>
      </button>
      <button class="pill-btn" data-drawer="supplements" style="background:#0a0e1e;border-color:#a78bfa40">
        <span class="pill-emoji">&#127807;</span>
        <div style="min-width:0"><div class="pill-title" style="color:#c4b5fd">Supplements</div><div class="pill-sub">SuppCo score: 89</div></div>
      </button>
      <button class="pill-btn" data-drawer="contacts" style="background:#051a12;border-color:#34d39940">
        <span class="pill-emoji">&#128241;</span>
        <div style="min-width:0"><div class="pill-title" style="color:#34d399">Contacts</div><div class="pill-sub">Doctors &amp; Pharmacy</div></div>
      </button>
    </div>
    <!-- Expanded: single full-width pill + drawer -->
    <div id="pill-expanded" style="display:none">
      <button class="pill-btn" id="pb-active" style="width:100%;border-radius:12px 12px 0 0" onclick="closePillDrawer()">
        <span class="pill-emoji" id="pb-active-emoji"></span>
        <div style="flex:1;min-width:0"><div class="pill-title" id="pb-active-title"></div><div class="pill-sub" id="pb-active-sub"></div></div>
        <span style="color:#94a3b8;font-size:13px;flex-shrink:0">&#8963; Close</span>
      </button>
      <div class="drawer-body" id="pill-drawer-body" style="border-color:transparent"></div>
    </div>
  </div>

  <div class="sec-label">By Category</div>
  <div class="cat-grid" id="cat-grid"></div>
</div>

<!-- LABS -->
<div id="page-labs" class="page">
  <div class="cat-scroll"><div class="cat-scroll-inner" id="cat-filter-btns"></div></div>
  <div id="status-filter-banner">
    <span class="sfb-label" id="sfb-label"></span>
    <button class="sfb-clear" onclick="clearStatusFilter()">Clear x</button>
  </div>
  <div id="bm-list"></div>
</div>

<!-- INSIGHTS -->
<div id="page-insights" class="page">
  <div class="ins-filter"><div class="ins-filter-inner" id="ins-filter-btns"></div></div>
  <div id="ins-list"></div>
</div>

<!-- ACTIONS -->
<div id="page-actions" class="page">
  <div class="sec-label">Priority Action Plan</div>
  <div id="actions-list"></div>
  <div class="next-panel">
    <div class="sec-label">Suggested Next Panel</div>
    <div id="next-panel-list"></div>
  </div>
</div>

// ── HELPERS ──────────────────────────────────────────────────────────────────
function gs(bm,val){
  if(val==null)return"nd";
  var lo=bm.optimal[0],hi=bm.optimal[1];
  if(bm.hb){if(val>=lo)return"o";if(val>=bm.concern[0])return"c";return"h";}
  if(val>=lo&&val<=hi)return"o";
  if(val>=bm.concern[0]&&val<=bm.concern[1])return"c";
  return"h";
}
function gl(bm){var a=bm.data.slice().reverse();for(var i=0;i<a.length;i++){if(a[i].v!=null)return a[i];}return null;}
function gsk(k){return gs(BM[k],gl(BM[k])?.v);}
function gt(data){
  var v=data.filter(function(d){return d.v!=null;});
  if(v.length<2)return"s";
  var p=(v[v.length-1].v-v[v.length-2].v)/v[v.length-2].v*100;
  return Math.abs(p)<3?"s":p>0?"u":"d";
}
function gc(s){return s==="o"?"#4ade80":s==="c"?"#fbbf24":s==="h"?"#f87171":"#64748b";}
function mkdot(s,sz){sz=sz||8;return'<span class="dot" style="width:'+sz+'px;height:'+sz+'px;background:'+gc(s)+(s==="o"?';box-shadow:0 0 7px '+gc(s)+'90':'')+';"></span>';}
function mkarrow(tr,hb){
  var good=(tr==="u"&&hb)||(tr==="d"&&!hb);
  var c=tr==="s"?"#64748b":good?"#4ade80":"#f87171";
  return'<span style="color:'+c+';font-size:12px;font-weight:700">'+(tr==="u"?"&#8593;":tr==="d"?"&#8595;":"&#8594;")+'</span>';
}
function opts(bm){return bm.optimal[1]>900?"Above "+bm.optimal[0]:bm.optimal[0]+" - "+bm.optimal[1];}
function score(){
  var t=0,c=0;
  Object.keys(BM).forEach(function(k){var v=gl(BM[k])?.v;if(v==null)return;var s=gsk(k);t+=s==="o"?100:s==="c"?55:10;c++;});
  return Math.round(t/c);
}

// ── PILL DRAWERS ─────────────────────────────────────────────────────────────
var openDrawer=null;

function buildContactsHTML(){
  return CONTACTS.map(function(c){
    var links="";
    if(c.phone) links+='<div class="dr-link"><a class="dr-link" href="tel:'+c.phone+'"><div class="dr-link-icon">&#128222;</div><div><div class="dr-link-label">Phone</div><div class="dr-link-val">'+c.phone+'</div></div></a></div>';
    if(c.email) links+='<div class="dr-link"><a class="dr-link" href="mailto:'+c.email+'"><div class="dr-link-icon">&#9993;</div><div><div class="dr-link-label">Email</div><div class="dr-link-val">'+c.email+'</div></div></a></div>';
    if(c.address) links+='<div class="dr-link"><a class="dr-link" href="https://maps.apple.com/?q='+encodeURIComponent(c.address)+'" target="_blank"><div class="dr-link-icon">&#128205;</div><div><div class="dr-link-label">Address</div><div class="dr-link-val">'+c.address+'</div></div></a></div>';
    return '<div class="dr-contact">'
      +'<div class="dr-contact-head"><div class="dr-avatar">'+c.icon+'</div>'
      +'<div><div class="dr-name">'+c.name+'</div><div class="dr-role">'+c.role+'</div><div class="dr-practice">'+c.practice+'</div></div></div>'
      +links
      +'<div class="dr-tags">'+c.tags.map(function(t){return'<span class="dr-tag">'+t+'</span>';}).join("")+'</div>'
      +'</div>';
  }).join("");
}

function buildMedsHTML(){
  return MEDS.map(function(m){
    return '<div class="dr-med-head"><span style="font-size:22px">&#128138;</span>'
      +'<div><div class="dr-med-name">'+m.name+'</div>'
      +'<div class="dr-med-dose" style="color:'+m.color+'">'+m.dose+' &middot; '+m.freq+'</div>'
      +'<div class="dr-med-rx">Rx: '+m.rx+'</div></div></div>'
      +'<div class="dr-section"><div class="dr-sec-lbl">Purpose</div><div class="dr-sec-txt">'+m.purpose+'</div></div>'
      +'<div class="dr-section"><div class="dr-sec-lbl">How it works</div><div class="dr-sec-txt">'+m.how+'</div></div>'
      +'<div class="dr-section"><div class="dr-sec-lbl">Biomarker Impact</div>'+m.impact.map(function(x){return'<div class="dr-impact">&#10003; '+x+'</div>';}).join("")+'</div>'
      +'<div class="dr-note" style="border-color:'+m.color+'30"><div class="dr-note-lbl" style="color:'+m.color+'">Clinical Note</div><div class="dr-note-txt">'+m.note+'</div></div>';
  }).join("");
}

function buildSuppsHTML(){
  return '<div class="dr-supp-header"><span style="font-size:16px">&#127807;</span><div><div class="dr-supp-score">SuppCo Stack &middot; Score: 89/100</div><div class="dr-supp-sub">Tap each to see biomarker impact</div></div></div>'
    +SUPPS.map(function(s,i){
      return '<div class="dr-supp-item" style="border-color:'+s.color+'25">'
        +'<div class="dr-supp-row" data-suppidx="'+i+'">'
        +'<div class="dr-supp-dot" style="background:'+s.color+'"></div>'
        +'<div style="flex:1;min-width:0"><div class="dr-supp-name">'+s.name+'</div><div class="dr-supp-brand">'+s.brand+' &middot; '+s.dose+'</div></div>'
        +'<span class="dr-supp-goal" style="color:'+s.color+';background:'+s.color+'18">'+s.goal+'</span>'
        +'<span class="dr-supp-chev" id="dsc-'+i+'">&#8964;</span>'
        +'</div>'
        +'<div class="dr-supp-detail" id="dsd-'+i+'">'
        +'<div class="dr-supp-effect">'+s.effect+'</div>'
        +s.impact.map(function(x){return'<div class="dr-supp-impact">&#8594; '+x+'</div>';}).join("")
        +'<div class="dr-supp-note">'+s.note+'</div>'
        +'</div></div>';
    }).join("");
}

var PILL_CONFIG={
  rx:{emoji:"&#128138;",title:"Medications",sub:"Levothyroxine 50mcg",bg:"#0a1628",border:"#3b82f640",titleColor:"#60a5fa"},
  supplements:{emoji:"&#127807;",title:"Supplements",sub:"SuppCo score: 89",bg:"#0a0e1e",border:"#a78bfa40",titleColor:"#c4b5fd"},
  contacts:{emoji:"&#128241;",title:"Contacts",sub:"Doctors & Pharmacy",bg:"#051a12",border:"#34d39940",titleColor:"#34d399"}
};

function togglePillDrawer(id){
  if(openDrawer===id){closePillDrawer();return;}
  openDrawer=id;
  var cfg=PILL_CONFIG[id];
  // Build content
  var body=document.getElementById("pill-drawer-body");
  if(id==="contacts") body.innerHTML=buildContactsHTML();
  else if(id==="rx") body.innerHTML=buildMedsHTML();
  else if(id==="supplements") body.innerHTML=buildSuppsHTML();
  body.style.borderColor=cfg.border;
  // Set active pill appearance
  var pb=document.getElementById("pb-active");
  pb.style.background=cfg.bg;
  pb.style.borderColor=cfg.border;
  document.getElementById("pb-active-emoji").innerHTML=cfg.emoji;
  document.getElementById("pb-active-title").textContent=cfg.title;
  document.getElementById("pb-active-title").style.color=cfg.titleColor;
  document.getElementById("pb-active-sub").textContent=cfg.sub;
  // Animate: hide collapsed pills, show expanded
  document.getElementById("pills-collapsed").style.display="none";
  document.getElementById("pill-expanded").style.display="block";
  setTimeout(function(){document.getElementById("pill-area").scrollIntoView({behavior:"smooth",block:"nearest"});},60);
}

function closePillDrawer(){
  openDrawer=null;
  document.getElementById("pill-expanded").style.display="none";
  document.getElementById("pills-collapsed").style.display="flex";
}

// ── CHARTS ───────────────────────────────────────────────────────────────────
var charts={},openKey=null;
function buildChart(k){
  var bm=BM[k];
  var pts=bm.data.map(function(d){
    var s=gs(bm,d.v);
    return'<div class="chart-pt" style="border-color:'+(d.v!=null?gc(s)+'50':'#1e293b')+'">'
      +'<div class="chart-pt-date">'+d.d+'</div>'
      +(d.v!=null?'<div class="chart-pt-val" style="color:'+gc(s)+'">'+d.v+'</div>':'<div style="font-size:11px;color:#334155">-</div>')
      +'</div>';
  }).join("");
  return'<div class="inline-chart" id="ic-'+k+'"><div class="inline-chart-inner">'
    +'<canvas id="cv-'+k+'" style="max-height:130px"></canvas>'
    +'<div class="chart-optimal">&#9679; Optimal: '+opts(bm)+' '+bm.unit+'</div>'
    +'<div class="chart-points">'+pts+'</div>'
    +'<div class="chart-close-row"><button class="chart-close-btn closechartbtn" data-key="'+k+'">Close &#8963;</button></div>'
    +'</div></div>';
}
function openCh(k){
  if(openKey&&openKey!==k)closeCh(openKey);
  if(openKey===k){closeCh(k);return;}
  openKey=k;
  var el=document.getElementById("ic-"+k);
  if(!el)return;
  el.classList.add("open");
  setTimeout(function(){
    var bm=BM[k],vd=bm.data.filter(function(d){return d.v!=null;}),cv=document.getElementById("cv-"+k);
    if(!cv)return;
    if(charts[k])charts[k].destroy();
    charts[k]=new Chart(cv.getContext("2d"),{
      type:"line",
      data:{labels:vd.map(function(d){return d.d;}),datasets:[{data:vd.map(function(d){return d.v;}),borderColor:"#60a5fa",backgroundColor:"rgba(96,165,250,0.12)",borderWidth:2.5,pointBackgroundColor:vd.map(function(d){return gc(gs(bm,d.v));}),pointRadius:5,fill:true,tension:0.35}]},
      options:{responsive:true,maintainAspectRatio:true,animation:{duration:500},plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return c.parsed.y+" "+bm.unit;}}}},scales:{x:{ticks:{color:"#64748b",font:{size:9}},grid:{color:"#1e293b"}},y:{ticks:{color:"#64748b",font:{size:9}},grid:{color:"#1e293b"}}}}
    });
  },60);
  var card=document.getElementById("bc-"+k);
  if(card)card.style.borderColor="#60a5fa50";
  setTimeout(function(){var c2=document.getElementById("bc-"+k);if(c2)c2.scrollIntoView({behavior:"smooth",block:"nearest"});},120);
}
function closeCh(k){
  var el=document.getElementById("ic-"+k);
  if(el)el.classList.remove("open");
  if(charts[k]){charts[k].destroy();delete charts[k];}
  if(openKey===k)openKey=null;
  var card=document.getElementById("bc-"+k);
  if(card)card.style.borderColor=gc(gsk(k))+"25";
}

// ── INFO MODAL ────────────────────────────────────────────────────────────────
function openInfo(k){
  var bm=BM[k];
  document.getElementById("info-name").textContent=bm.label;
  document.getElementById("info-cat").textContent=bm.cat+" · "+(bm.unit||"ratio");
  document.getElementById("info-what").textContent=bm.what;
  document.getElementById("info-why").textContent=bm.why;
  document.getElementById("info-range").textContent=opts(bm)+" "+bm.unit;
  document.getElementById("info-modal").classList.add("open");
}
function closeInfo(){document.getElementById("info-modal").classList.remove("open");}

// ── TABS ──────────────────────────────────────────────────────────────────────
var curTab="overview";
function showTab(id){
  curTab=id;
  document.querySelectorAll(".page").forEach(function(p){p.classList.remove("active");});
  document.querySelectorAll(".tabn").forEach(function(b){b.classList.remove("active");});
  document.getElementById("page-"+id).classList.add("active");
  var ids=["overview","labs","insights","actions"];
  var idx=ids.indexOf(id);
  if(idx>=0)document.querySelectorAll(".tabn")[idx].classList.add("active");
  if(id==="labs")renderLabs();
  window.scrollTo(0,0);
}

// ── STATUS FILTER ─────────────────────────────────────────────────────────────
var activeSF=null;
function filterByStatus(s){
  if(activeSF===s){activeSF=null;clearPills();}
  else{
    activeSF=s;
    document.getElementById("pill-optimal").style.borderColor=s==="optimal"?"#4ade80":"#22c55e25";
    document.getElementById("pill-concern").style.borderColor=s==="concern"?"#fbbf24":"#f59e0b25";
    document.getElementById("pill-high").style.borderColor=s==="high"?"#f87171":"#ef444425";
  }
  curCat="All";showTab("labs");
}
function clearPills(){
  document.getElementById("pill-optimal").style.borderColor="#22c55e25";
  document.getElementById("pill-concern").style.borderColor="#f59e0b25";
  document.getElementById("pill-high").style.borderColor="#ef444425";
}
function clearStatusFilter(){activeSF=null;clearPills();renderLabs();}

// ── OVERVIEW ──────────────────────────────────────────────────────────────────
function renderOverview(){
  var sc=score();
  var ringColor=sc>=75?"#4ade80":sc>=55?"#fbbf24":"#f87171";
  document.getElementById("score-ring").setAttribute("stroke-dasharray",(sc/100)*188.5+" 188.5");
  document.getElementById("score-ring").setAttribute("stroke",ringColor);
  document.getElementById("score-text").textContent=sc;
  var counts={o:0,c:0,h:0};
  Object.keys(BM).forEach(function(k){var s=gsk(k);if(counts[s]!=null)counts[s]++;});
  document.getElementById("cnt-optimal").textContent=counts.o;
  document.getElementById("cnt-concern").textContent=counts.c;
  document.getElementById("cnt-high").textContent=counts.h;

  document.getElementById("cat-grid").innerHTML=CATS.filter(function(c){return c!=="All";}).map(function(c){
    var ks=Object.keys(BM).filter(function(k){return BM[k].cat===c;});
    var opt=ks.filter(function(k){return gsk(k)==="o";}).length,tot=ks.length;
    var ws=ks.some(function(k){return gsk(k)==="h";})?"h":ks.some(function(k){return gsk(k)==="c";})?"c":"o";
    return'<div class="cat-card catcard" data-cat="'+c+'" style="border-color:'+gc(ws)+'25">'
      +'<div class="cat-top"><span style="font-size:16px">'+CICONS[c]+'</span>'+mkdot(ws,7)+'</div>'
      +'<div class="cat-name">'+c+'</div><div class="cat-sub">'+opt+'/'+tot+' optimal</div>'
      +'<div class="cat-bar-bg"><div class="cat-bar" style="width:'+Math.round(opt/tot*100)+'%;background:'+gc(ws)+'"></div></div>'
      +'</div>';
  }).join("");
}

// ── LABS ──────────────────────────────────────────────────────────────────────
var curCat="All";
function renderCatBtns(){
  document.getElementById("cat-filter-btns").innerHTML=CATS.map(function(c){
    return'<button class="cat-btn catfilterbtn'+(c===curCat?" active":"")+'" data-cat="'+c+'">'+(c!=="All"?CICONS[c]+" ":"")+c+'</button>';
  }).join("");
}
function filterCat(c){curCat=c;activeSF=null;clearPills();if(openKey)closeCh(openKey);renderLabs();}
function renderLabs(){
  renderCatBtns();
  var keys=Object.keys(BM).filter(function(k){return curCat==="All"||BM[k].cat===curCat;});
  var banner=document.getElementById("status-filter-banner");
  if(activeSF){
    keys=keys.filter(function(k){return gsk(k)===activeSF[0];});
    var lbls={optimal:"Showing: Optimal",concern:"Showing: Monitor",high:"Showing: Action required"};
    document.getElementById("sfb-label").textContent=lbls[activeSF];
    document.getElementById("sfb-label").style.color=gc(activeSF[0]);
    banner.classList.add("visible");
  } else {banner.classList.remove("visible");}
  document.getElementById("bm-list").innerHTML=keys.map(function(k){
    var bm=BM[k],vd=bm.data.filter(function(d){return d.v!=null;}),lat=vd[vd.length-1],prev=vd[vd.length-2],s=gs(bm,lat?.v),tr=gt(bm.data);
    return'<div class="bm-card labbm" id="bc-'+k+'" data-key="'+k+'" style="border-color:'+gc(s)+'20">'
      +'<div class="bm-inner">'+mkdot(s,8)
      +'<div style="flex:1;min-width:0"><div class="bm-label-row"><span class="bm-name" style="font-size:12px">'+bm.label+'</span>'
      +'<button class="ibtn infobtn" data-key="'+k+'">i</button></div>'
      +(prev?'<div class="bm-prev">Prev: '+prev.v+' '+bm.unit+' ('+prev.d+')</div>':"")+'</div>'
      +'<div style="text-align:right;flex-shrink:0">'+(lat?'<div class="bm-val" style="color:'+gc(s)+';font-size:16px">'+lat.v+'</div><div class="bm-unit">'+bm.unit+' '+mkarrow(tr,bm.hb)+'</div>':'<div style="font-size:11px;color:#334155">No data</div>')+'</div>'
      +'</div>'+buildChart(k)+'</div>';
  }).join("");
}

// ── INSIGHTS ─────────────────────────────────────────────────────────────────
var ITC={turning:{color:"#60a5fa",bg:"#0a1628",border:"#60a5fa30",icon:"&#8599;"},stabilized:{color:"#c4b5fd",bg:"#130f2a",border:"#a78bfa30",icon:"&#9672;"},alert:{color:"#f87171",bg:"#1a0808",border:"#ef444430",icon:"&#9888;"},warning:{color:"#fbbf24",bg:"#1a1208",border:"#f59e0b30",icon:"&#9888;"},positive:{color:"#4ade80",bg:"#051a0f",border:"#22c55e30",icon:"&#10003;"},rx:{color:"#60a5fa",bg:"#0a1628",border:"#60a5fa30",icon:"&#128138;"}};
var IFC=[{id:"all",lb:"All"},{id:"alert",lb:"Alerts"},{id:"warning",lb:"Warnings"},{id:"turning",lb:"Turning"},{id:"stabilized",lb:"Stabilized"},{id:"positive",lb:"Wins"},{id:"rx",lb:"Rx"}];
var curIF="all";
function renderInsights(f){
  curIF=f;
  document.getElementById("ins-filter-btns").innerHTML=IFC.map(function(x){return'<button class="ins-btn insfilterbtn'+(x.id===f?" active":"")+'" data-filter="'+x.id+'">'+x.lb+'</button>';}).join("");
  var list=f==="all"?INSIGHTS:INSIGHTS.filter(function(i){return i.type===f;});
  document.getElementById("ins-list").innerHTML=list.map(function(ins){
    var cfg=ITC[ins.type]||ITC.positive;
    return'<div class="ins-card" style="background:'+cfg.bg+';border-color:'+cfg.border+'"><div class="ins-row"><span class="ins-icon">'+cfg.icon+'</span><div><div class="ins-title" style="color:'+cfg.color+'">'+ins.title+'</div><div class="ins-body">'+ins.body+'</div></div></div></div>';
  }).join("");
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function renderActions(){
  var UC={high:{color:"#f87171",bg:"#1a0808",lb:"HIGH"},medium:{color:"#fbbf24",bg:"#1a1208",lb:"MEDIUM"},low:{color:"#4ade80",bg:"#051a0f",lb:"LOW"}};
  document.getElementById("actions-list").innerHTML=ACTIONS.map(function(a){
    var uc=UC[a.urgency];
    return'<div class="action-card" style="border-color:'+uc.color+'25">'
      +'<div class="action-num" style="background:'+uc.bg+';border-color:'+uc.color+'60;color:'+uc.color+'">'+a.priority+'</div>'
      +'<div style="flex:1"><div class="action-badges"><span class="urgency-badge" style="color:'+uc.color+';background:'+uc.bg+'">'+uc.lb+'</span>'
      +(a.doctor?'<span class="doctor-badge">&#8594; '+a.doctor+'</span>':"")+'</div>'
      +'<div class="action-title">'+a.action+'</div><div class="action-why">'+a.why+'</div></div></div>';
  }).join("");
  document.getElementById("next-panel-list").innerHTML=NEXT_PANEL.map(function(t,i){
    return'<div class="panel-item" style="border-bottom:'+(i<NEXT_PANEL.length-1?"1px solid #1e293b":"none")+'"><div class="panel-dot"></div><div class="panel-text">'+t+'</div></div>';
  }).join("");
}

// ── EVENT DELEGATION ─────────────────────────────────────────────────────────
document.addEventListener("click",function(e){
  var t=e.target;

  // Pill drawer buttons
  var pillBtn=t.closest(".pill-btn[data-drawer]");
  if(pillBtn){togglePillDrawer(pillBtn.getAttribute("data-drawer"));return;}

  // Supplement toggle inside drawer
  var suppRow=t.closest("[data-suppidx]");
  if(suppRow){
    var idx=suppRow.getAttribute("data-suppidx");
    var det=document.getElementById("dsd-"+idx);
    var chev=document.getElementById("dsc-"+idx);
    if(!det)return;
    var isOpen=det.classList.contains("open");
    det.classList.toggle("open",!isOpen);
    if(chev)chev.innerHTML=isOpen?"&#8964;":"&#8963;";
    return;
  }

  // Info button
  var infoBtn=t.closest(".infobtn");
  if(infoBtn){e.stopPropagation();openInfo(infoBtn.getAttribute("data-key"));return;}

  // Close chart button
  var closeBtn=t.closest(".closechartbtn");
  if(closeBtn){e.stopPropagation();closeCh(closeBtn.getAttribute("data-key"));return;}

  // Category card
  var catCard=t.closest(".catcard");
  if(catCard){curCat=catCard.getAttribute("data-cat");activeSF=null;clearPills();showTab("labs");return;}

  // Category filter button
  var catBtn=t.closest(".catfilterbtn");
  if(catBtn){filterCat(catBtn.getAttribute("data-cat"));return;}

  // Lab biomarker card
  var labCard=t.closest(".labbm");
  if(labCard){openCh(labCard.getAttribute("data-key"));return;}

  // Insights filter button
  var insBtn=t.closest(".insfilterbtn");
  if(insBtn){renderInsights(insBtn.getAttribute("data-filter"));return;}
});

// ── INIT ─────────────────────────────────────────────────────────────────────
renderOverview();
renderCatBtns();
renderLabs();
renderInsights("all");
renderActions();
</script>
</body>
</html>
